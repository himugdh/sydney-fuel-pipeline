name: Daily fuel price pipeline

on:
  schedule:
    - cron: "17 19 * * *"   # 6:17am Sydney time (GitHub uses UTC)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Fetch prices
        env:
          FUEL_API_KEY: ${{ secrets.FUEL_API_KEY }}
          FUEL_API_SECRET: ${{ secrets.FUEL_API_SECRET }}
        run: python fetch_prices.py

      - name: Quality checks
        run: python quality_checks.py

      - name: Load into database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python load_to_db.py